# Bundle patch for dsh-finish-line.
#
# 插入本插件一行。executor: subagent —— 收尾两步走进程内 spawn 子代理：
#   · 不传 agentOptions，子代理继承父会话的 provider/model（满血）
#   · 子代理空对话开始，首条提示只有那一步的一句原话，父上下文与人格都不预置
#   · 子代理不能 ask_user_question（宿主 DELEGATED_CALLER）；只有它自己汇报说
#     「定不了」时，才把人格请出来替它拍一句，平时不花这份 token
# 想改回「侧栏可见的两个新会话 + 人格代答」：executor: session。
# 首次想只看不动手：dryRun: true。
- insert:
    - id: finish-line
      name: dsh-finish-line
      config:
        enabled: true
        executor: subagent
        dryRun: false
        quietMs: 20000
        requireToolCall: true
        subagent:
          provider: spawn
          agentOptions: null
          decideOnStuck: true
        persona:
          enabled: true
          provider: magpie
          model: local-31-99/qwen3.8-27b
